name: IronLog
options:
  bundleIdPrefix: com.ironlog
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"
  createIntermediateGroups: true

schemes:
  IronLog:
    build:
      targets:
        IronLog: all
        IronLogWidgets: all
        IronLogWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IronLogTests
    profile:
      config: Release
    analyze:
      config: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "W88C7J82R5"

targets:
  IronLog:
    type: application
    platform: iOS
    sources:
      - path: IronLog
    entitlements:
      path: IronLog/IronLog.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: IronLog/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSHealthUpdateUsageDescription: IronLog saves your strength training workouts to Apple Health
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog
        PRODUCT_NAME: IronLog
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    resources:
      - path: IronLog/Resources
    dependencies:
      - target: IronLogWidgets
      - sdk: HealthKit.framework

  IronLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: IronLogWidgets
      - path: IronLog/Services/RestTimerActivity.swift
    info:
      path: IronLogWidgets/Info.plist
      properties:
        CFBundleDisplayName: IronLog Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog.widgets
        PRODUCT_NAME: IronLogWidgets
        SWIFT_EMIT_LOC_STRINGS: true

  IronLogWatch:
    type: application
    platform: watchOS
    sources:
      - path: IronLogWatch
    entitlements:
      path: IronLogWatch/IronLogWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: IronLogWatch/Info.plist
      properties:
        WKApplication: true
        NSHealthShareUsageDescription: Read health data during workouts
        NSHealthUpdateUsageDescription: Record workout data
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog.watch
        PRODUCT_NAME: IronLogWatch
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: HealthKit.framework

  IronLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IronLogTests
    dependencies:
      - target: IronLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IronLog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IronLog"
        BUNDLE_LOADER: "$(TEST_HOST)"
