name: IronLog
options:
  bundleIdPrefix: com.ironlog
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"
  createIntermediateGroups: true

schemes:
  IronLog:
    build:
      targets:
        IronLog: all
        IronLogWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IronLogTests
    profile:
      config: Release
    analyze:
      config: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "W88C7J82R5"

targets:
  IronLog:
    type: application
    platform: iOS
    sources:
      - path: IronLog
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog
        PRODUCT_NAME: IronLog
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    resources:
      - path: IronLog/Resources
    dependencies:
      - target: IronLogWidgets

  IronLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: IronLogWidgets
      - path: IronLog/Services/RestTimerActivity.swift
    info:
      path: IronLogWidgets/Info.plist
      properties:
        CFBundleDisplayName: IronLog Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog.widgets
        PRODUCT_NAME: IronLogWidgets
        SWIFT_EMIT_LOC_STRINGS: true

  IronLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IronLogTests
    dependencies:
      - target: IronLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.W88C7J82R5.ironlog.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IronLog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IronLog"
        BUNDLE_LOADER: "$(TEST_HOST)"
