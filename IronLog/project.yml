name: IronLog
options:
  bundleIdPrefix: com.ironlog
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  IronLog:
    type: application
    platform: iOS
    sources:
      - path: IronLog
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.ironlog.app
        PRODUCT_NAME: IronLog
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    resources:
      - path: IronLog/Resources

  IronLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IronLogTests
    dependencies:
      - target: IronLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.ironlog.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IronLog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IronLog"
        BUNDLE_LOADER: "$(TEST_HOST)"
