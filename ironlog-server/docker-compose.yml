services:
  app:
    build: .
    ports:
      # Temporary compatibility port for old app builds and direct health checks.
      # Production HTTPS traffic should come through Caddy on 443.
      - "${IRONLOG_HTTP_PORT:-8844}:8000"
    expose:
      - "8000"
    volumes:
      - ${IRONLOG_SCHEMAS_DIR:-../schemas}:/schemas:ro
      - ${IRONLOG_DOCS_DIR:-../docs}:/docs:ro
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=ironlog
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      - mongo
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - app
    ports:
      - "${IRONLOG_TLS_HTTPS_PORT:-443}:443"
    environment:
      - IRONLOG_DOMAIN=${IRONLOG_DOMAIN:-v170184.hosted-by-vdsina.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "${IRONLOG_MONGO_BIND:-127.0.0.1}:${IRONLOG_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
